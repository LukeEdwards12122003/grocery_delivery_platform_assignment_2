$kind: http-request
name: Place Order
url: "{{base_url}}/api/orders"
method: POST
headers:
  Authorization: Bearer {{customer_token}}
body:
  type: json
  content: |-
    {
      "item": "Eggs",
      "quantity": 5
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Order is created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Created order has the correct details", function () {
          const order = pm.response.json();

          pm.expect(order.item).to.equal("Eggs");
          pm.expect(order.quantity).to.equal(5);
          pm.expect(order.status).to.equal("Draft");
          pm.expect(order._id).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 3718403904014162
