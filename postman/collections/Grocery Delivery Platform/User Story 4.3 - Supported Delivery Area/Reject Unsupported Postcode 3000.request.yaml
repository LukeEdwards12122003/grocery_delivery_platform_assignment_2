$kind: http-request
name: Reject Unsupported Postcode 3000
url: "{{base_url}}/api/orders/delivery-method"
method: PATCH
body:
  type: json
  content: |-
    {
      "orderIds": ["6acec2b1dbd81f83ef0f671c"],
      "deliveryMethod": "standard",
      "streetAddress": "12 Main Street",
      "suburb": "Brisbane City",
      "postcode": "3000"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Unsupported postcode 3000 is rejected', () => {
        pm.response.to.have.status(400);
      });

      pm.test('API returns the unsupported-area message', () => {
        const response = pm.response.json();
        pm.expect(response.message).to.eql(
          'Delivery is not available in this area'
        );
      });
    language: text/javascript
order: 2237067655328871
