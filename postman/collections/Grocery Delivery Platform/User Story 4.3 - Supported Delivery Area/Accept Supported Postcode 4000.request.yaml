$kind: http-request
name: Accept Supported Postcode 4000
url: "{{base_url}}/api/orders/delivery-method"
method: PATCH
body:
  type: json
  content: |-
    {
      "orderIds": ["6acec2b1dbd81f83ef0f671c"],
      "deliveryMethod": "standard",
      "streetAddress": "12 Main Street",
      "suburb": "Brisbane City",
      "postcode": "4000"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Supported postcode is accepted', () => {
        pm.response.to.have.status(200);
      });

      const orders = pm.response.json();

      pm.test('Order contains the supported postcode', () => {
        pm.expect(orders[0].postcode).to.eql('4000');
      });
    language: text/javascript
order: 1791797237236
