$kind: http-request
name: Reject Negative Quantity
url: "{{base_url}}/api/orders"
method: POST
headers:
  Authorization: Bearer {{customer_token}}
body:
  type: json
  content: |-
    {
      "item": "Milk",
      "quantity": -1,
      "deliveryAddress": "123 Test Street"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Negative quantity is rejected", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Correct error message is returned", function () {
          pm.expect(pm.response.json().message)
              .to.equal("Quantity must be greater than zero");
      });
    language: text/javascript
order: 3819284803384188
