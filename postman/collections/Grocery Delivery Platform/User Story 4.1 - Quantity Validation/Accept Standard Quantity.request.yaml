$kind: http-request
name: Accept Standard Quantity
description: ""
url: "{{base_url}}/api/orders"
method: POST
headers:
  Authorization: Bearer {{customer_token}}
body:
  type: json
  content: |+
    {
        "item": "Milk",
        "quantity": 2
    }

scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Standard valid quantity is accepted", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Order quantity is 2", function () {
          const order = pm.response.json();
          pm.expect(order.quantity).to.equal(2);
      });
    language: text/javascript
order: 244297423955002
