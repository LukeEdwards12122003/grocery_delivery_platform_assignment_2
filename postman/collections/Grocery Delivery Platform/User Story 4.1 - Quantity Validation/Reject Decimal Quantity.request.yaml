$kind: http-request
name: Reject Decimal Quantity
description: ""
url: "{{base_url}}/api/orders"
method: POST
headers:
  Authorization: Bearer {{customer_token}}
body:
  type: json
  content: |+
    {
        "item": "Milk",
        "quantity": 2.5
    }

scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Decimal quantity is rejected", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Correct quantity error is returned", function () {
          pm.expect(pm.response.json().message)
              .to.equal("Quantity must be greater than zero");
      });
    language: text/javascript
order: 4298801858109404
