$kind: http-request
name: Customer Cannot Update Order Status
url: "{{base_url}}/api/orders/6ad465e17a114c303cc8ed71/status"
method: PUT
headers:
  Authorization: Bearer {{customer_token}}
body:
  type: json
  content: |-
    {
      "status": "Preparing"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Customer cannot update order status", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Staff-only restriction is returned", function () {
          pm.expect(pm.response.json().message)
              .to.equal("Only store staff can update order status");
      });
    language: text/javascript
order: 4503599094482985
