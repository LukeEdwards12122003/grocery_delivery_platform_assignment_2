$kind: http-request
name: Accept Valid Four-Digit Postcode
url: "{{base_url}}/api/orders"
method: POST
body:
  type: json
  content: |-
    {
      "item": "Bread",
      "quantity": 1,
      "streetAddress": "45 Queen Street",
      "suburb": "Brisbane City",
      "postcode": "4000"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Valid four-digit postcode is accepted", function () {
        pm.response.to.have.status(201);
      });

      const response = pm.response.json();

      pm.test("Address fields are saved", function () {
        pm.expect(response.streetAddress).to.eql("45 Queen Street");
        pm.expect(response.suburb).to.eql("Brisbane City");
        pm.expect(response.postcode).to.eql("4000");
      });
    language: text/javascript
order: 4183677467060725
