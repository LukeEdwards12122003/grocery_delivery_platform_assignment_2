$kind: http-request
name: Reject Missing Street Address
url: "{{base_url}}/api/orders"
method: POST
body:
  type: json
  content: |-
    {
      "item": "Milk",
      "quantity": 2,
      "suburb": "Brisbane City",
      "postcode": "4000"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Missing street address is rejected", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Correct error message is returned", function () {
        pm.expect(pm.response.json().message)
          .to.equal("Street address, suburb and postcode are required");
      });
    language: text/javascript
order: 163334253855063
