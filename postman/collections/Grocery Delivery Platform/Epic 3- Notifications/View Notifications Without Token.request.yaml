$kind: http-request
name: View Notifications Without Token
url: "{{base_url}}/api/notifications"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Notifications request without a token is rejected", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Missing-token error is returned", function () {
          pm.expect(pm.response.json().message).to.equal("Not authorized, no token");
      });
    language: text/javascript
settings: {}
order: 3881872030146142
