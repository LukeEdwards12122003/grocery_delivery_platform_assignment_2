$kind: http-request
name: View Customer Notifications
url: "{{base_url}}/api/notifications"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Customer notifications load successfully", function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json()).to.be.an("array");
      });

      pm.test("Customer can see their order notification", function () {
          const notifications = pm.response.json();
          const notification = notifications.find(
              n => n._id === "6ad49d587a114c303cc8edec"
          );

          pm.expect(notification).to.exist;
          pm.expect(notification.recipientId).to.equal("6ad44f487a114c303cc8ed49");
          pm.expect(notification.orderId).to.equal("6ad450277a114c303cc8ed51");
      });

      pm.test("Read status remains saved", function () {
          const notification = pm.response.json().find(
              n => n._id === "6ad49d587a114c303cc8edec"
          );

          pm.expect(notification).to.exist;
          pm.expect(notification.isRead).to.be.true;
      });
    language: text/javascript
settings: {}
order: 1792298785996
